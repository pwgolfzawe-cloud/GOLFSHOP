<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านรู้ — ระบบขาย TikTok + บัญชีภาษี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F7F9;--surface:#fff;--surface-2:#EDF1F4;--surface-3:#E3E9ee;
  --ink:#161B22;--ink-2:#4C5765;--ink-3:#7B8695;--line:#DCE2E8;--line-2:#C8D1DA;
  --accent:#0E9E96;--accent-ink:#0A6B65;--accent-soft:#DCF3F1;
  --profit:#0F8A4C;--loss:#CF3A3F;--warn:#A96700;--warn-soft:#FBEEDA;
  --radius:13px;--radius-sm:9px;
  --sans:"IBM Plex Sans Thai",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(20,27,34,.05),0 8px 24px -14px rgba(20,27,34,.16);
  --shadow-sm:0 1px 2px rgba(20,27,34,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1015;--surface:#161B22;--surface-2:#1E242D;--surface-3:#262E38;
  --ink:#E7ECF1;--ink-2:#A2ADBA;--ink-3:#727E8C;--line:#282F39;--line-2:#333C48;
  --accent:#2FD3C8;--accent-ink:#8DEAE2;--accent-soft:#12312E;
  --profit:#3ECE7E;--loss:#F0736F;--warn:#E3A54C;--warn-soft:#382a12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -16px rgba(0,0,0,.6);--shadow-sm:0 1px 2px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
h1,h2,h3{line-height:1.25;margin:0}
a{color:var(--accent-ink)}

/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.authcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:2rem;max-width:400px;width:100%}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.35rem;letter-spacing:-.02em;margin-bottom:.3rem}
.logo .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--accent-ink));display:grid;place-items:center;color:#fff;font-weight:700}
.muted{color:var(--ink-3);font-size:.85rem}
.field{margin:.9rem 0}
.field label{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:.3rem;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select{
  width:100%;padding:.6rem .7rem;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--bg);color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:var(--radius-sm);padding:.65rem 1rem;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:.4rem .7rem;font-size:.8rem}
.btn.danger{background:transparent;color:var(--loss);border:1px solid transparent}
.btn.danger:hover{background:var(--loss);color:#fff}
.err{color:var(--loss);font-size:.82rem;margin-top:.5rem;min-height:1.2em}
.tabsw{display:flex;gap:.3rem;margin:1rem 0;background:var(--surface-2);padding:.25rem;border-radius:var(--radius-sm)}
.tabsw button{flex:1;background:transparent;border:0;padding:.5rem;border-radius:7px;color:var(--ink-2);font-weight:600;font-size:.85rem}
.tabsw button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

/* app shell */
#app{display:none;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1080px;margin:0 auto;padding:.6rem 1.1rem;display:flex;align-items:center;gap:.7rem}
.topbar .logo{font-size:1.05rem}
.topbar .logo .mark{width:30px;height:30px;font-size:.85rem;border-radius:8px}
.shopname{font-size:.78rem;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:.2rem .6rem}
.sp{flex:1}
nav.nav{max-width:1080px;margin:0 auto;padding:0 1.1rem;display:flex;gap:.2rem;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.nav button{background:transparent;border:0;border-bottom:2px solid transparent;padding:.7rem .8rem;color:var(--ink-2);font-weight:600;font-size:.86rem;white-space:nowrap}
nav.nav button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
main{max-width:1080px;margin:0 auto;padding:1.3rem 1.1rem 4rem}
.page{display:none}
.page.on{display:block}
h2.pt{font-size:1.35rem;margin-bottom:.2rem;letter-spacing:-.01em}
.sub{color:var(--ink-3);font-size:.88rem;margin-bottom:1.1rem}

.grid{display:grid;gap:.8rem}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow-sm)}
.stat .lb{font-size:.76rem;color:var(--ink-3);font-weight:500}
.stat .v{font-family:var(--mono);font-size:1.5rem;font-weight:600;margin-top:.2rem}
.stat .v.pos{color:var(--profit)}.stat .v.neg{color:var(--loss)}
.stat .sub2{font-size:.72rem;color:var(--ink-3);margin-top:.15rem}

table{width:100%;border-collapse:collapse;font-size:.85rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
th,td{padding:.55rem .7rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{background:var(--surface-2);font-size:.74rem;color:var(--ink-2);font-weight:600}
tbody tr:last-child td{border-bottom:0}
.tar{text-align:right;font-family:var(--mono)}
.pos{color:var(--profit);font-weight:600}.neg{color:var(--loss);font-weight:600}
.pill{display:inline-block;font-size:.7rem;padding:.1rem .45rem;border-radius:5px;background:var(--surface-2);color:var(--ink-2)}

.rowform{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:.5rem;align-items:end;margin-bottom:.5rem}
@media(max-width:700px){.rowform{grid-template-columns:1fr 1fr;gap:.4rem}}
.mini{font-size:.72rem;color:var(--ink-3);margin-bottom:.2rem}
.profitbox{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--radius);padding:1rem 1.1rem;margin-top:1rem}
.profitbox .row{display:flex;justify-content:space-between;font-size:.85rem;padding:.15rem 0;color:var(--ink-2)}
.profitbox .row.big{font-size:1.15rem;font-weight:700;color:var(--ink);border-top:1px dashed var(--line-2);margin-top:.4rem;padding-top:.5rem}
.profitbox .row .num{font-family:var(--mono)}

.callout{border:1px solid var(--line);border-radius:var(--radius);padding:.85rem 1rem;margin:.9rem 0;display:flex;gap:.7rem;font-size:.86rem}
.callout.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--ink-2)}
.callout .i{font-weight:700;color:var(--warn)}
.bar{height:9px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:.4rem 0}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-ink))}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:var(--bg);padding:.65rem 1.1rem;border-radius:99px;font-size:.85rem;box-shadow:var(--shadow);transition:transform .28s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
.inline{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hd{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.taxopt{border:1px solid var(--line);border-radius:var(--radius);padding:1rem;cursor:pointer}
.taxopt.win{border-color:var(--accent);background:var(--accent-soft)}
.taxopt .t{font-weight:600}.taxopt .big{font-family:var(--mono);font-size:1.3rem;font-weight:600;margin-top:.3rem}
.empty{text-align:center;color:var(--ink-3);padding:2rem;font-size:.9rem}
.pmbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:7px;padding:.3rem .7rem;font-size:.78rem;font-weight:600;cursor:pointer}
.pmbtn.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.pbar{display:grid;grid-template-columns:minmax(78px,24%) 1fr auto;gap:.6rem;align-items:center;margin:.4rem 0;font-size:.82rem}
.pbar-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.pbar-track{background:var(--surface-2);border-radius:99px;height:16px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-ink));border-radius:99px;min-width:3px;transition:width .35s}
.pbar-fill.top{background:linear-gradient(90deg,var(--profit),color-mix(in srgb,var(--profit) 65%,#000))}
.pbar-val{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.daychart{display:flex;align-items:flex-end;gap:3px;height:130px;overflow-x:auto;padding-top:.3rem}
.daycol{flex:1 0 14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:12px}
.dcbar{width:70%;max-width:16px;background:var(--accent);border-radius:3px 3px 0 0;min-height:0;transition:height .3s}
.dcbar.now{background:var(--profit)}
.dclbl{font-size:.6rem;color:var(--ink-3);margin-top:.2rem;font-family:var(--mono);height:.9rem}
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.2rem 0 .1rem}
.toolbar input,.toolbar select{padding:.45rem .6rem;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);font-size:.85rem}
label.ck{display:flex;gap:.4rem;align-items:center;font-size:.82rem;color:var(--ink-2)}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth">
  <div class="authcard">
    <div class="logo"><span class="mark">รู้</span>ร้านรู้</div>
    <p class="muted">ระบบขาย TikTok + ต้นทุน + บัญชีภาษี</p>
    <div class="tabsw">
      <button id="tabIn" class="on" onclick="setAuthTab('in')">เข้าสู่ระบบ</button>
      <button id="tabUp" onclick="setAuthTab('up')">สมัครใหม่</button>
    </div>
    <div class="field"><label>อีเมล</label><input type="email" id="email" placeholder="you@email.com" autocomplete="email"></div>
    <div class="field"><label>รหัสผ่าน</label><input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn block" id="authBtn" onclick="doAuth()">เข้าสู่ระบบ</button>
    <div class="err" id="authErr"></div>
    <p class="muted" style="margin-top:1rem;font-size:.78rem">เปิดไฟล์นี้ในเบราว์เซอร์ (Chrome/Safari) เพื่อให้เชื่อมต่อฐานข้อมูลได้ · สมัครครั้งแรกอาจต้องยืนยันอีเมล</p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar"><div class="topbar-in">
    <div class="logo"><span class="mark">รู้</span>ร้านรู้</div>
    <span class="shopname" id="shopName">—</span>
    <div class="sp"></div>
    <button class="btn ghost sm" onclick="signOut()">ออก</button>
  </div></div>
  <nav class="nav" id="nav"></nav>
  <main>
    <div class="page" id="p-dash"></div>
    <div class="page" id="p-sale"></div>
    <div class="page" id="p-orders"></div>
    <div class="page" id="p-products"></div>
    <div class="page" id="p-pack"></div>
    <div class="page" id="p-expenses"></div>
    <div class="page" id="p-tax"></div>
    <div class="page" id="p-team"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- setup shop modal (inline) -->
<div id="setup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;place-items:center;padding:1.5rem" >
  <div class="authcard">
    <div class="logo"><span class="mark">รู้</span>ตั้งร้านใหม่</div>
    <p class="muted">ยังไม่มีร้าน — ตั้งชื่อร้านเพื่อเริ่มใช้งาน</p>
    <div class="field"><label>ชื่อร้าน</label><input type="text" id="newShop" placeholder="เช่น ร้านของกอล์ฟ"></div>
    <button class="btn block" onclick="createShop()">สร้างร้าน</button>
    <div class="err" id="setupErr"></div>
  </div>
</div>

<!-- edit modal -->
<div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:85;place-items:center;padding:1.2rem">
  <div class="authcard" style="max-width:470px">
    <div class="logo" style="font-size:1.05rem"><span class="mark" style="width:28px;height:28px;font-size:.8rem">✎</span><span id="em_title">แก้ไข</span></div>
    <div id="em_body"></div>
    <div id="em_note" class="muted" style="font-size:.76rem;margin-top:.5rem"></div>
    <div class="inline" style="margin-top:1rem"><button class="btn" onclick="saveEdit()">บันทึกการแก้ไข</button><button class="btn ghost" onclick="closeEdit()">ยกเลิก</button><span class="err" id="em_err"></span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---------- config ----------
const SUPABASE_URL = "https://lrxjngcsqtrvevbyjqdb.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyeGpuZ2NzcXRydmV2YnlqcWRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNDcyNTIsImV4cCI6MjA5ODYyMzI1Mn0.536QGLQEDFzNnTaA-tE5v_t8szCx41ygVnxj6yLb8KE";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- helpers ----------
const $ = s=>document.querySelector(s);
const fmt = n => (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Math.round(Number(n)||0).toLocaleString('th-TH');
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
let TOASTt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(TOASTt);TOASTt=setTimeout(()=>t.classList.remove('show'),2200);}
let authTab='in';
function setAuthTab(t){authTab=t;$('#tabIn').classList.toggle('on',t==='in');$('#tabUp').classList.toggle('on',t==='up');$('#authBtn').textContent=t==='in'?'เข้าสู่ระบบ':'สมัครสมาชิก';$('#authErr').textContent='';}

let STATE={shop:null, shops:[], products:[], materials:[]};

// ---------- auth ----------
async function doAuth(){
  const email=$('#email').value.trim(), password=$('#pass').value;
  const errEl=$('#authErr'); errEl.textContent='';
  if(!email||!password){errEl.textContent='กรอกอีเมลและรหัสผ่านให้ครบ';return;}
  $('#authBtn').disabled=true;
  try{
    let res;
    if(authTab==='up'){
      res=await sb.auth.signUp({email,password});
      if(res.error) throw res.error;
      if(!res.data.session){errEl.style.color='var(--accent-ink)';errEl.textContent='สมัครสำเร็จ! เช็คอีเมลเพื่อยืนยัน แล้วกลับมาเข้าสู่ระบบ';$('#authBtn').disabled=false;return;}
    }else{
      res=await sb.auth.signInWithPassword({email,password});
      if(res.error) throw res.error;
    }
    await boot();
  }catch(e){errEl.style.color='var(--loss)';errEl.textContent=thErr(e.message);}
  $('#authBtn').disabled=false;
}
function thErr(m){
  if(/Invalid login/i.test(m))return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if(/already registered/i.test(m))return 'อีเมลนี้สมัครแล้ว ลองเข้าสู่ระบบ';
  if(/at least 6/i.test(m))return 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัว';
  if(/Email not confirmed/i.test(m))return 'ยังไม่ได้ยืนยันอีเมล เช็คกล่องเมลก่อน';
  return m;
}
async function signOut(){await sb.auth.signOut();location.reload();}

// ---------- edit (แก้ไขข้อมูลที่กรอกผิด) ----------
const EDIT_SCHEMA={
  product:{table:'rr_products',title:'แก้ไขสินค้า',reload:async()=>{await loadMasters();renderProducts();},fields:[
    {k:'name',l:'ชื่อสินค้า',t:'text'},{k:'sku',l:'SKU',t:'text'},
    {k:'sell_price',l:'ราคาขาย/ชิ้น',t:'number'},{k:'cost_price',l:'ต้นทุนเฉลี่ย/ชิ้น',t:'number'},
    {k:'stock_qty',l:'สต็อกคงเหลือ',t:'number'},{k:'low_stock',l:'เตือนเมื่อเหลือ',t:'number'}]},
  material:{table:'rr_packaging_materials',title:'แก้ไขวัสดุ',reload:async()=>{await loadMasters();renderPack();},fields:[
    {k:'name',l:'ชื่อวัสดุ',t:'text'},{k:'unit',l:'หน่วย',t:'text'}]},
  expense:{table:'rr_expenses',title:'แก้ไขรายจ่าย',reload:renderExpenses,fields:[
    {k:'expense_date',l:'วันที่',t:'date'},
    {k:'category',l:'หมวด',t:'select',opts:[['stock','ต้นทุนสินค้า'],['packaging','ค่าแพ็ค'],['ads','โฆษณา'],['live','ไลฟ์'],['utility','น้ำ/ไฟ/เน็ต'],['other','อื่นๆ']]},
    {k:'amount',l:'จำนวนเงิน',t:'number'},{k:'description',l:'รายละเอียด',t:'text'},{k:'has_receipt',l:'มีใบเสร็จ',t:'check'}]},
  order:{table:'rr_orders',title:'แก้ไขออเดอร์ (หัวบิล)',reload:renderOrders,note:'แก้ตัวเลขบิลได้ · ถ้าจะเปลี่ยน "รายการสินค้า" ให้ลบบิลแล้วบันทึกใหม่ (กันสต็อกเพี้ยน)',fields:[
    {k:'order_date',l:'วันที่',t:'date'},{k:'order_no',l:'เลขบิล',t:'text'},{k:'customer_name',l:'ลูกค้า',t:'text'},
    {k:'discount',l:'ส่วนลด/โค้ด',t:'number'},{k:'platform_fee',l:'ค่าคอม TikTok',t:'number'},
    {k:'ship_charged',l:'ค่าส่งเก็บลูกค้า',t:'number'},{k:'ship_cost',l:'ค่าส่งจ่ายจริง',t:'number'}]}
};
let EDIT={type:null,id:null};
async function openEdit(type,id){
  const sc=EDIT_SCHEMA[type];EDIT={type,id};
  const {data:rec,error}=await sb.from(sc.table).select('*').eq('id',id).single();
  if(error){toast(error.message);return;}
  $('#em_title').textContent=sc.title;
  $('#em_note').textContent=sc.note||'';
  $('#em_err').textContent='';
  $('#em_body').innerHTML=sc.fields.map(f=>{
    const v=rec[f.k];
    if(f.t==='check') return `<label class="ck" style="margin:.7rem 0"><input type="checkbox" id="ef_${f.k}" ${v?'checked':''}> ${f.l}</label>`;
    if(f.t==='select') return `<div class="field"><label>${f.l}</label><select id="ef_${f.k}">${f.opts.map(o=>`<option value="${o[0]}" ${o[0]===v?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
    return `<div class="field"><label>${f.l}</label><input type="${f.t}" id="ef_${f.k}" value="${v==null?'':String(v).replace(/"/g,'&quot;')}"></div>`;
  }).join('');
  $('#editModal').style.display='grid';
}
function closeEdit(){$('#editModal').style.display='none';EDIT={type:null,id:null};}
async function saveEdit(){
  const sc=EDIT_SCHEMA[EDIT.type];const obj={};
  sc.fields.forEach(f=>{const e=$('#ef_'+f.k);
    if(f.t==='check')obj[f.k]=e.checked;
    else if(f.t==='number')obj[f.k]=+e.value||0;
    else obj[f.k]=e.value||null;});
  const {error}=await sb.from(sc.table).update(obj).eq('id',EDIT.id);

// ---------- boot ----------
async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){show('auth');return;}
  const {data:shops,error}=await sb.rpc('rr_my_shop_list');
  if(error){toast('โหลดร้านไม่ได้: '+error.message);}
  if(!shops||!shops.length){ $('#auth').style.display='none'; $('#setup').style.display='grid'; return; }
  STATE.shops=shops;
  let saved=null; try{saved=localStorage.getItem('rr_shop');}catch(e){}
  const sel=shops.find(s=>s.shop_id===saved)||shops[0];
  STATE.shop={id:sel.shop_id, name:sel.name, role:sel.role};
  $('#setup').style.display='none';
  renderShopSwitcher();
  show('app');
  buildNav();
  await loadMasters();
  go('dash');
}
function renderShopSwitcher(){
  const box=$('#shopName');
  if(STATE.shops.length>1){
    box.innerHTML='<select id="shopSel" style="border:0;background:transparent;color:inherit;font:inherit;cursor:pointer">'+
      STATE.shops.map(s=>'<option value="'+s.shop_id+'"'+(s.shop_id===STATE.shop.id?' selected':'')+'>'+s.name+' ('+roleTH(s.role)+')</option>').join('')+'</select>';
    $('#shopSel').onchange=function(){switchShop(this.value);};
  } else { box.textContent=STATE.shop.name; }
}
async function switchShop(id){
  const s=STATE.shops.find(x=>x.shop_id===id); if(!s) return;
  STATE.shop={id:s.shop_id, name:s.name, role:s.role};
  try{localStorage.setItem('rr_shop',id);}catch(e){}
  await loadMasters(); go('dash');
}
function roleTH(r){return {owner:'เจ้าของ',admin:'แอดมิน',member:'พนักงาน'}[r]||r;}
function show(w){$('#auth').style.display=w==='auth'?'grid':'none';$('#app').style.display=w==='app'?'block':'none';}

async function createShop(){
  const name=$('#newShop').value.trim();
  if(!name){$('#setupErr').textContent='ใส่ชื่อร้าน';return;}
  const {data,error}=await sb.rpc('rr_create_shop',{p_name:name});
  if(error){$('#setupErr').textContent=error.message;return;}
  try{ if(data) localStorage.setItem('rr_shop',data); }catch(e){}
  await boot();
}

function statCard(lb,cls,v,sub){const d=el('div','card stat');d.innerHTML='<div class="lb">'+lb+'</div><div class="v '+(cls||'')+'">'+v+'</div><div class="sub2">'+(sub||'')+'</div>';return d;}
let DASH_PROD=[], DASH_METRIC='rev', DASH_DAY={rev:{},today:0,ym:''};
function drawDayChart(){
  const box=$('#dayChart'); if(!box) return;
  const days=new Date(new Date(DASH_DAY.ym+'-01').getFullYear(), new Date(DASH_DAY.ym+'-01').getMonth()+1, 0).getDate();
  const vals=[]; for(let d=1; d<=days; d++){const ds=DASH_DAY.ym+'-'+String(d).padStart(2,'0'); vals.push({d, v:DASH_DAY.rev[ds]||0});}
  const max=Math.max.apply(null,vals.map(x=>x.v))||1;
  box.innerHTML='<div class="daychart">'+vals.map(x=>{
    const h=x.v>0?Math.max(4,x.v/max*100):0;
    return '<div class="daycol" title="'+x.d+' — '+fmt0(x.v)+' บาท"><div class="dcbar'+(x.d===DASH_DAY.today?' now':'')+'" style="height:'+h+'%"></div><div class="dclbl">'+(x.d%5===0||x.d===1||x.d===DASH_DAY.today?x.d:'')+'</div></div>';
  }).join('')+'</div>';
}
function drawProdChart(){
  const box=$('#prodChart'); if(!box) return;
  const m=DASH_METRIC;
  const arr=DASH_PROD.slice().sort((a,b)=>b[m]-a[m]).slice(0,12);
  if(!arr.length){box.innerHTML='<div class="empty">ยังไม่มีการขายเดือนนี้</div>';return;}
  const max=Math.max.apply(null,arr.map(x=>x[m]))||1;
  box.innerHTML=arr.map((x,i)=>{
    const val=x[m], pct=Math.max(2,val/max*100);
    const lbl=m==='rev'?fmt0(val)+' ฿':fmt0(val)+' ชิ้น';
    return '<div class="pbar"><div class="pbar-name" title="'+(x.name||'').replace(/"/g,'')+'">'+x.name+'</div>'+
      '<div class="pbar-track"><div class="pbar-fill'+(i===0?' top':'')+'" style="width:'+pct.toFixed(1)+'%"></div></div>'+
      '<div class="pbar-val">'+lbl+'</div></div>';
  }).join('');
}
function setProdMetric(m){DASH_METRIC=m;var r=$('#pm_rev'),q=$('#pm_qty');if(r)r.classList.toggle('act',m==='rev');if(q)q.classList.toggle('act',m==='qty');drawProdChart();}

function drawItems(){
  const wrap=$('#s_items');wrap.innerHTML='';
  SALE.items.forEach((it,idx)=>{
    const row=el('div','rowform');
    const opts=STATE.products.map(p=>'<option value="'+p.id+'"'+(p.id===it.product_id?' selected':'')+'>'+p.name+'</option>').join('');

    row.innerHTML=`<div><div class="mini">สินค้า</div><select onchange="setProd(${idx},this.value)">${opts}</select></div>
      <div><div class="mini">จำนวน</div><input type="number" value="${it.qty}" min="0" oninput="setF(${idx},'qty',this.value)"></div>
      <div><div class="mini">ราคาขาย/ชิ้น</div><input type="number" value="${it.unit_price}" oninput="setF(${idx},'unit_price',this.value)"></div>
      <div><button class="btn danger sm" onclick="delItem(${idx})" ${SALE.items.length<2?'style="visibility:hidden"':''}>✕</button></div>`;

function addItem(){SALE.items.push({product_id:STATE.products[0].id,qty:1});drawItems();}
function delItem(i){SALE.items.splice(i,1);drawItems();}
function setProd(i,v){const p=STATE.products.find(x=>x.id===v)||{};SALE.items[i].product_id=v;SALE.items[i].unit_price=Number(p.sell_price)||0;drawItems();}
function setF(i,f,v){SALE.items[i][f]=v===''?0:Number(v);calcSale();}
function calcSale(){
  const rev=SALE.items.reduce((s,i)=>s+Number(i.qty)*Number(i.unit_price),0);
  const disc=+$('#s_disc').value||0, fee=+$('#s_fee').value||0, shipc=+$('#s_shipc').value||0, shipx=+$('#s_shipx').value||0;
  const net=rev+shipc-disc-fee-shipx;
  const mg=rev>0?(net/rev*100):0;
  $('#s_profit').innerHTML=
    `<div class="row"><span>ราคาสินค้ารวม</span><span class="num">${fmt(rev)}</span></div>
     <div class="row"><span>+ ค่าส่งเก็บลูกค้า</span><span class="num">${fmt(shipc)}</span></div>
     <div class="row"><span>− ส่วนลด / ค่าคอม</span><span class="num">−${fmt(disc+fee)}</span></div>
     <div class="row"><span>− ค่าส่งจ่ายจริง</span><span class="num">−${fmt(shipx)}</span></div>
     <div class="row big"><span>เหลือหลังหักคอม+ส่ง ${rev>0?'('+mg.toFixed(0)+'%)':''}</span><span class="num ${net>=0?'pos':'neg'}">${fmt(net)}</span></div>
     <div class="row" style="font-size:.75rem;color:var(--ink-3)"><span>* ต้นทุนสินค้าลงเป็นรายจ่ายตอนซื้อแล้ว ไม่หักซ้ำที่นี่</span><span></span></div>`;
}
async function saveSale(){
  const errEl=$('#s_err');errEl.textContent='';
  const items=SALE.items.filter(i=>Number(i.qty)>0);
  if(!items.length){errEl.textContent='ต้องมีสินค้าอย่างน้อย 1 รายการ';return;}
  const shop=STATE.shop.id;
  const {data:ord,error}=await sb.from('rr_orders').insert({
    shop_id:shop, order_no:$('#s_no').value||null, order_date:$('#s_date').value,
    customer_name:$('#s_cust').value||null,
    discount:+$('#s_disc').value||0, platform_fee:+$('#s_fee').value||0,
    ship_charged:+$('#s_shipc').value||0, ship_cost:+$('#s_shipx').value||0
  }).select().single();
  if(error){errEl.textContent=error.message;return;}
  // Cash basis: ไม่หักต้นทุนตอนขาย (unit_cost=0) ต้นทุนของถูกลงเป็นรายจ่ายตอนซื้อแล้ว
  const rows=items.map(i=>{const p=STATE.products.find(x=>x.id===i.product_id)||{};return{
    shop_id:shop, order_id:ord.id, product_id:i.product_id, product_name:p.name,
    qty:Number(i.qty), unit_price:Number(i.unit_price), unit_cost:0};});
  const {error:e2}=await sb.from('rr_order_items').insert(rows);
  if(e2){errEl.textContent=e2.message;return;}
  // ตัดสต็อกสินค้าตามจำนวนที่ขาย (best-effort)
  for(const i of items){const p=STATE.products.find(x=>x.id===i.product_id);
    if(p) await sb.from('rr_products').update({stock_qty:Math.max(0,Number(p.stock_qty)-Number(i.qty))}).eq('id',i.product_id);}
  toast('บันทึกออเดอร์แล้ว ✓');
  await loadMasters();renderSale();
}

// ---------- TAX ----------
function calcStepTax(net){
  const B=[[150000,0],[150000,.05],[200000,.10],[250000,.15],[250000,.20],[1000000,.25],[3000000,.30],[Infinity,.35]];
  let tax=0,rem=Math.max(0,net);
  for(const [amt,rate] of B){const t=Math.min(rem,amt);tax+=t*rate;rem-=t;if(rem<=0)break;}
  return tax;
}
async function renderTax(){
  const c=$('#p-tax');c.innerHTML='<h2 class="pt">บัญชี & ภาษี</h2><div class="empty">กำลังโหลด…</div>';
  const year=new Date().getFullYear();
  const yStart=year+'-01-01',yEnd=year+'-12-31';
  const [{data:pnl},{data:exp},{data:ts}]=await Promise.all([
    sb.from('rr_v_order_pnl').select('*').gte('order_date',yStart).lte('order_date',yEnd),
    sb.from('rr_expenses').select('amount,has_receipt').gte('expense_date',yStart).lte('expense_date',yEnd),
    sb.from('rr_tax_settings').select('*').eq('tax_year',year).maybeSingle()
  ]);
  const gross=(pnl||[]).reduce((s,o)=>s+Number(o.item_revenue)+Number(o.ship_charged),0);
  const cogs=(pnl||[]).reduce((s,o)=>s+Number(o.cogs),0);
  const fees=(pnl||[]).reduce((s,o)=>s+Number(o.platform_fee)+Number(o.ship_cost),0);
  const expReceipt=(exp||[]).filter(e=>e.has_receipt).reduce((s,e)=>s+Number(e.amount),0);
  const allowance=ts?Number(ts.personal_allowance)+Number(ts.other_allowance):60000;
  // flat 60
  const flatExpense=gross*0.6;
  const netFlat=Math.max(0,gross-flatExpense-allowance);
  const taxFlatStep=calcStepTax(netFlat);
  // actual
  const actualExpense=cogs+fees+expReceipt;
  const netActual=Math.max(0,gross-actualExpense-allowance);
  const taxActualStep=calcStepTax(netActual);
  // method 2 (0.5% of income) if income>120k
  const m2=gross>120000?gross*0.005:0;
  const taxFlat=(m2>5000)?Math.max(taxFlatStep,m2):taxFlatStep;
  const taxActual=(m2>5000)?Math.max(taxActualStep,m2):taxActualStep;
  const flatWins=taxFlat<=taxActual;

  c.innerHTML='';
  c.appendChild(el('h2','pt','บัญชี & ภาษี ปี '+(year+543)));
  c.appendChild(el('p','sub','เงินได้ประเภท 40(8) · ระบบเทียบให้ว่าหักแบบไหนเสียภาษีน้อยกว่า (ประมาณการ — ยืนยันกับนักบัญชีก่อนยื่นจริง)'));

  const g=el('div','grid g3');
  g.appendChild(statCard('รายได้รวม (ยอดขาย)','',fmt0(gross),'ฐานเงินได้ 40(8)'));
  g.appendChild(statCard('ค่าคอม+ค่าส่ง','',fmt0(fees),'หักตามจริงได้'));
  g.appendChild(statCard('รายจ่ายมีใบเสร็จ','',fmt0(expReceipt),'รวมต้นทุนของ+ค่าแพ็ค'));
  c.appendChild(g);

  const cmp=el('div','grid g2');cmp.style.marginTop='.9rem';
  cmp.appendChild(taxOpt('หักเหมา 60%',flatExpense,netFlat,taxFlat,flatWins,'ไม่ต้องมีใบเสร็จ'));
  cmp.appendChild(taxOpt('หักตามจริง',actualExpense,netActual,taxActual,!flatWins,'ค่าคอม+ส่ง + รายจ่ายมีใบเสร็จ (รวมต้นทุนของ)'));
  c.appendChild(cmp);

  const rec=el('div','callout warn');
  rec.innerHTML='<span class="i">✓</span><div>แนะนำปีนี้: ยื่นแบบ <b>'+(flatWins?'หักเหมา 60%':'หักตามจริง')+'</b> เสียภาษีประมาณ <b>'+fmt0(flatWins?taxFlat:taxActual)+' บาท</b>'+
    (m2>5000?' · หมายเหตุ: ภาษีวิธีที่ 2 (0.5% ของรายได้ = '+fmt0(m2)+') มีผล เพราะมากกว่า 5,000 บาท ระบบเลือกจำนวนที่มากกว่าให้แล้ว':'')+'</div>';
  c.appendChild(rec);

  // filing calendar
  const cal=el('div','grid g2');cal.style.marginTop='.3rem';
  cal.appendChild(cardBox('ภ.ง.ด.94 (ครึ่งปีแรก)','ยื่น ก.ค.–ก.ย. · เสียภาษีล่วงหน้าจากรายได้ ม.ค.–มิ.ย.'));
  cal.appendChild(cardBox('ภ.ง.ด.90 (ทั้งปี)','ยื่น ม.ค.–มี.ค. ปีถัดไป · หักภาษีที่จ่ายจาก ภ.ง.ด.94 แล้ว'));
  c.appendChild(cal);
}
function taxOpt(title,expense,net,tax,win,note){
  const d=el('div','taxopt'+(win?' win':''));
  d.innerHTML=`<div class="t">${title} ${win?'<span class="pill" style="background:var(--accent);color:#fff">ประหยัดกว่า</span>':''}</div>
    <div class="muted" style="font-size:.75rem">${note}</div>
    <div class="big ${tax>0?'':'pos'}">${fmt0(tax)} <span style="font-size:.8rem;color:var(--ink-3)">บาท</span></div>
    <div class="muted" style="font-size:.78rem;margin-top:.4rem">หักค่าใช้จ่าย ${fmt0(expense)} · เงินได้สุทธิ ${fmt0(net)}</div>`;
  return d;
}
function cardBox(t,s){const d=el('div','card');d.innerHTML='<b>'+t+'</b><p class="muted" style="margin:.3rem 0 0">'+s+'</p>';return d;}

// ---------- TEAM ----------
async function renderTeam(){
  const c=$('#p-team');c.innerHTML='';
  c.appendChild(el('h2','pt','ทีมงาน'));
  c.appendChild(el('p','sub','เชิญพ่อ/ทีมเข้ามาทำงานในร้าน “'+STATE.shop.name+'” ร่วมกัน — ทุกคนเห็นและแก้ข้อมูลร้านเดียวกัน'));
  const canManage=STATE.shop.role==='owner'||STATE.shop.role==='admin';
  if(canManage){
    const f=el('div','card');
    f.innerHTML='<b>เชิญสมาชิกใหม่</b>'+
      '<div class="callout info" style="margin:.5rem 0"><span class="ico" style="background:var(--accent);color:#fff;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none">i</span>'+
      '<div>คนที่จะเชิญต้อง <b>สมัครเข้าระบบก่อน</b> (เปิดลิงก์ร้านรู้ กด “สมัครใหม่” ด้วยอีเมลตัวเอง แล้ว <u>อย่าเพิ่งสร้างร้าน</u>) จากนั้นกอล์ฟกรอกอีเมลเขาที่นี่เพื่อดึงเข้าร้าน</div></div>'+
      '<div class="grid g3">'+
      '<div style="grid-column:span 2"><div class="mini">อีเมลสมาชิก</div><input type="email" id="tm_email" placeholder="teammate@email.com"></div>'+
      '<div><div class="mini">สิทธิ์</div><select id="tm_role"><option value="member">พนักงาน</option><option value="admin">แอดมิน</option></select></div>'+
      '</div><div style="margin-top:.6rem" class="inline"><button class="btn" onclick="inviteMember()">เชิญเข้าร้าน</button><span class="err" id="tm_err"></span></div>';
    c.appendChild(f);
  } else {
    c.appendChild(el('div','callout info','<span class="i">i</span><div>คุณเป็น “พนักงาน” ในร้านนี้ — ดูรายชื่อทีมได้ แต่การเชิญ/นำออกทำได้เฉพาะเจ้าของหรือแอดมิน</div>'));
  }
  const {data,error}=await sb.rpc('rr_shop_member_list',{p_shop:STATE.shop.id});
  if(error){c.appendChild(el('div','empty',error.message));return;}
  const w=el('div','tablewrap');w.style.marginTop='.9rem';
  w.innerHTML='<table><thead><tr><th>อีเมล</th><th>สิทธิ์</th><th>เข้าร่วมเมื่อ</th><th></th></tr></thead><tbody>'+
    (data||[]).map(m=>'<tr><td>'+m.email+'</td><td><span class="pill">'+roleTH(m.role)+'</span></td><td>'+String(m.added_at).slice(0,10)+'</td>'+
    '<td>'+((canManage&&m.role!=='owner')?'<button class="btn danger sm" onclick="removeMember(\''+m.user_id+'\')">นำออก</button>':'')+'</td></tr>').join('')+'</tbody></table>';
  c.appendChild(w);
}
async function inviteMember(){
  const email=($('#tm_email').value||'').trim();if(!email){$('#tm_err').textContent='ใส่อีเมล';return;}
  const {error}=await sb.rpc('rr_invite_member',{p_shop:STATE.shop.id,p_email:email,p_role:$('#tm_role').value});
  if(error){$('#tm_err').textContent=error.message;return;}
  toast('เชิญเข้าร้านแล้ว ✓');renderTeam();
}
async function removeMember(uid){
  if(!confirm('นำสมาชิกนี้ออกจากร้าน?'))return;
  const {error}=await sb.rpc('rr_remove_member',{p_shop:STATE.shop.id,p_user:uid});
  if(error){toast(error.message);return;}
  toast('นำออกแล้ว');renderTeam();
}

// ---------- filters ----------
function filterOrders(){
  const q=($('#of_q').value||'').toLowerCase(), f=$('#of_from').value||'', t=$('#of_to').value||'';
  document.querySelectorAll('#p-orders tbody tr').forEach(tr=>{const d=tr.dataset.d||'';
    tr.hidden=!((!q||(tr.dataset.txt||'').includes(q))&&(!f||d>=f)&&(!t||d<=t));});
}
function filterProducts(){
  const q=($('#pf_q').value||'').toLowerCase();
  document.querySelectorAll('#p-products tbody tr').forEach(tr=>{tr.hidden=!(!q||(tr.dataset.txt||'').includes(q));});
}
function filterMats(){
  const q=($('#mf_q').value||'').toLowerCase();
  document.querySelectorAll('#p-pack tbody tr').forEach(tr=>{tr.hidden=!(!q||(tr.dataset.txt||'').includes(q));});
}
function filterExp(){
  const q=($('#xf_q').value||'').toLowerCase(), cat=$('#xf_cat').value||'', f=$('#xf_from').value||'', t=$('#xf_to').value||'';
  document.querySelectorAll('#p-expenses tbody tr').forEach(tr=>{const d=tr.dataset.d||'';
    tr.hidden=!((!q||(tr.dataset.txt||'').includes(q))&&(!cat||tr.dataset.cat===cat)&&(!f||d>=f)&&(!t||d<=t));});
}

// ---------- init ----------
(async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) await boot(); else show('auth');
})();
</script>
